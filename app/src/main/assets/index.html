    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const achievements = [
            { id: 1, title: '20 минут', goal: 20 * 60 * 1000, icon: 'fa-clock', desc: 'Первая веха уже позади. Пульс и давление начинают возвращаться к более спокойным значениям, потому что никотиновая стимуляция ослабевает. Это маленький, но очень реальный сигнал: тело сразу замечает отсутствие дыма.' },
            { id: 2, title: '2 часа', goal: 2 * 60 * 60 * 1000, icon: 'fa-hand-sparkles', desc: 'Кровообращение постепенно становится ровнее, пальцы рук и ног могут ощущаться теплее. Тяга может накатывать волнами, но каждая такая волна проходит. Ты уже тренируешь навык пережидать импульс без автоматического действия.' },
            { id: 3, title: '4 часа', goal: 4 * 60 * 60 * 1000, icon: 'fa-droplet', desc: 'Организм начинает жить без очередной дозы никотина. Полезно пить воду, дышать медленнее и занять руки чем-то простым. Сейчас важна не героическая сила воли, а спокойное прохождение ближайших часов.' },
            { id: 4, title: '8 часов', goal: 8 * 60 * 60 * 1000, icon: 'fa-wind', desc: 'Уровень угарного газа в крови снижается, а кислороду становится легче занимать свое место. Это один из первых заметных физиологических выигрышей. Даже если настроение скачет, внутри уже идет работа по восстановлению нормального дыхания клеток.' },
            { id: 5, title: '12 часов', goal: 12 * 60 * 60 * 1000, icon: 'fa-lungs', desc: 'Кровь переносит кислород эффективнее, чем во время регулярного курения. Может появиться желание проверить себя одной сигаретой, но это ловушка привычки. Лучше отметить половину первых суток как честную победу организма и решения.' },
            { id: 6, title: '24 часа', goal: 24 * 60 * 60 * 1000, icon: 'fa-heart', desc: 'Первые сутки без дыма завершены. Сердцу уже не приходится снова и снова отвечать на никотиновый удар. Тяга может быть сильной, но теперь у тебя есть доказательство: целый день можно прожить без сигареты.' },
            { id: 7, title: '36 часов', goal: 36 * 60 * 60 * 1000, icon: 'fa-brain', desc: 'Мозг перестраивает ожидания: привычные моменты курения начинают ощущаться пустыми паузами. Это неприятно, но полезно. Заполни паузы короткой прогулкой, водой, дыханием или сообщением близкому человеку. Новый ритуал рождается повторением.' },
            { id: 8, title: '48 часов', goal: 48 * 60 * 60 * 1000, icon: 'fa-seedling', desc: 'Через двое суток вкус и запахи могут становиться ярче. Нервные окончания постепенно отходят от постоянного табачного раздражения. Это хороший момент заметить простые вещи: аромат еды, чистое дыхание, отсутствие запаха дыма на руках и одежде.' },
            { id: 9, title: '72 часа', goal: 72 * 60 * 60 * 1000, icon: 'fa-person-walking', desc: 'Три дня - важный психологический рубеж. У части людей дыхание становится свободнее, хотя кашель может временно усилиться из-за очищения бронхов. Самое трудное уже не кажется абстрактным: ты прошел несколько настоящих волн тяги.' },
            { id: 10, title: '4 дня', goal: 4 * 24 * 60 * 60 * 1000, icon: 'fa-mug-hot', desc: 'Начинается жизнь без привычных связок: кофе и сигарета, стресс и сигарета, пауза и сигарета. Каждая разорванная связка делает зависимость слабее. Заменяй не только никотин, но и сам сценарий поведения.' },
            { id: 11, title: '5 дней', goal: 5 * 24 * 60 * 60 * 1000, icon: 'fa-bolt', desc: 'Энергия может идти волнами: то бодрость, то усталость. Это нормально для перестройки сна, аппетита и нервной системы. Важно не требовать от себя идеального самочувствия. Пять дней без сигарет - уже серьезная работа.' },
            { id: 12, title: '1 неделя', goal: 7 * 24 * 60 * 60 * 1000, icon: 'fa-calendar-check', desc: 'Неделя без дыма - это уже не случайность. Ты пережил рабочие, бытовые и эмоциональные ситуации без старого автоматизма. Теперь полезно посмотреть, какие триггеры были самыми сильными, и заранее подготовить ответы на них.' },
            { id: 13, title: '10 дней', goal: 10 * 24 * 60 * 60 * 1000, icon: 'fa-face-smile', desc: 'Тяга обычно становится менее непрерывной и чаще приходит короткими вспышками. Это значит, что между импульсом и действием появляется пространство выбора. В такие моменты помогает простая фраза: желание пройдет, а достижение останется.' },
            { id: 14, title: '2 недели', goal: 14 * 24 * 60 * 60 * 1000, icon: 'fa-heart-pulse', desc: 'Две недели дают организму заметную передышку. Кровообращение и дыхание продолжают адаптироваться, а уверенность растет за счет повторения. Ты уже не просто бросаешь курить, ты строишь новую норму поведения.' },
            { id: 15, title: '3 недели', goal: 21 * 24 * 60 * 60 * 1000, icon: 'fa-dumbbell', desc: 'Физическая нагрузка может ощущаться легче, особенно если добавить прогулки или мягкие тренировки. Тело учится работать без табачных пауз и кислородного долга. Не спеши с рекордами: стабильность сейчас важнее спортивного подвига.' },
            { id: 16, title: '1 месяц', goal: 30 * 24 * 60 * 60 * 1000, icon: 'fa-medal', desc: 'Месяц без сигарет - мощная отметка. Многие ритуалы уже ослабли, а дыхание, сон и кожа могут подавать первые приятные сигналы. Если тяга появляется, это не откат, а напоминание закрепить новый образ жизни.' },
            { id: 17, title: '6 недель', goal: 42 * 24 * 60 * 60 * 1000, icon: 'fa-shield-alt', desc: 'За шесть недель ты собрал много доказательств собственной устойчивости. Организм получает меньше воспалительного и токсического давления, а психика видит: стресс можно проживать иначе. Это время укреплять защитные привычки, а не проверять себя сигаретой.' },
            { id: 18, title: '2 месяца', goal: 60 * 24 * 60 * 60 * 1000, icon: 'fa-lungs', desc: 'Дыхательные пути продолжают восстанавливаться от постоянного раздражения. Может стать легче подниматься по лестнице, гулять быстрее или просыпаться без тяжести. Хорошая идея - сравнить себя не с идеалом, а с первым днем отказа.' },
            { id: 19, title: '10 недель', goal: 70 * 24 * 60 * 60 * 1000, icon: 'fa-fire', desc: 'Старые триггеры могут появляться неожиданно: праздник, усталость, конфликт, алкоголь. Но теперь у тебя есть опыт проходить их. Десять недель показывают, что зависимость слабеет не драматично, а тихо, через повторяющиеся победы.' },
            { id: 20, title: '3 месяца', goal: 90 * 24 * 60 * 60 * 1000, icon: 'fa-route', desc: 'Три месяца - уже дистанция, а не стартовый рывок. Кровообращение, выносливость и повседневное дыхание часто становятся заметно лучше. Самооценка тоже меняется: ты видишь себя человеком, который способен доводить важное решение до результата.' },
            { id: 21, title: '4 месяца', goal: 120 * 24 * 60 * 60 * 1000, icon: 'fa-wallet', desc: 'К этому времени особенно хорошо видна финансовая сторона отказа. Деньги, которые раньше сгорали каждый день, можно направить на удовольствие, здоровье или запас спокойствия. Это не только экономия, а возвращение контроля над маленькими ежедневными решениями.' },
            { id: 22, title: '5 месяцев', goal: 150 * 24 * 60 * 60 * 1000, icon: 'fa-person-hiking', desc: 'Пять месяцев без дыма помогают телу привыкнуть к более активной жизни. Даже обычная ходьба может приносить больше удовольствия, потому что дыхание не так быстро упирается в усталость. Хороший момент выбрать движение, которое действительно нравится.' },
            { id: 23, title: '6 месяцев', goal: 180 * 24 * 60 * 60 * 1000, icon: 'fa-mountain', desc: 'Полгода - большой рубеж. Тяга может появляться редко, но иногда очень убедительно, особенно в старых ситуациях. Не воспринимай спокойствие как разрешение на одну сигарету. Полгода ценны именно потому, что цепочка не была разорвана.' },
            { id: 24, title: '7 месяцев', goal: 210 * 24 * 60 * 60 * 1000, icon: 'fa-comments', desc: 'Ты уже можешь стать примером для других, даже если не говоришь об этом вслух. Люди замечают устойчивость, запах, энергию, спокойствие. История отказа становится частью личности: не громким лозунгом, а тихим доказательством перемен.' },
            { id: 25, title: '8 месяцев', goal: 240 * 24 * 60 * 60 * 1000, icon: 'fa-bed', desc: 'Сон и восстановление часто становятся стабильнее, если не мешают другие факторы. Организм больше не получает вечерние никотиновые встряски и ночные последствия дыма. Хороший сон усиливает весь процесс: настроение, аппетит, иммунитет и способность не срываться.' },
            { id: 26, title: '9 месяцев', goal: 270 * 24 * 60 * 60 * 1000, icon: 'fa-tree', desc: 'Через девять месяцев дыхательные пути у многих людей чувствуют себя заметно свободнее. Кашель и одышка могут уменьшаться, особенно при регулярном движении. Это не магия, а результат долгого отсутствия дыма, который раньше каждый день мешал восстановлению.' },
            { id: 27, title: '10 месяцев', goal: 300 * 24 * 60 * 60 * 1000, icon: 'fa-gem', desc: 'Десять месяцев - почти год новой идентичности. Уже важно не только не курить, но и не романтизировать прошлую привычку. Память может сглаживать плохое, поэтому полезно помнить реальные причины, из-за которых ты начал этот путь.' },
            { id: 28, title: '11 месяцев', goal: 330 * 24 * 60 * 60 * 1000, icon: 'fa-compass', desc: 'До года остается совсем немного. Иногда именно близость большой даты провоцирует странные мысли: будто цель достигнута заранее. Но путь продолжается сегодня. Одиннадцать месяцев показывают направление, а каждый новый день закрепляет его.' },
            { id: 29, title: '350 дней', goal: 350 * 24 * 60 * 60 * 1000, icon: 'fa-flag-checkered', desc: 'Финиш первого года уже рядом. Это время оглянуться на моменты, где раньше сигарета казалась обязательной, и увидеть, что они пережиты иначе. Ты не просто терпел, ты много раз выбирал себя будущего.' },
            { id: 30, title: '1 год', goal: 365 * 24 * 60 * 60 * 1000, icon: 'fa-trophy', desc: 'Год без сигарет - огромная личная победа. Риск сердечно-сосудистых проблем, связанных с курением, существенно снижается, а главное - ты доказал себе устойчивость на всех сезонах, праздниках, стрессах и обычных днях. Это уже новая глава жизни.' }
        ];
        const bodySystems = [
            { id: 1, name: 'Дыхательная система', icon: 'fa-lungs', color: 'text-blue-500 bg-blue-50', short: 'Очищение бронхов и восстановление дыхания.', text: 'После отказа от курения дыхательные пути постепенно освобождаются от постоянного раздражения. Мерцательный эпителий бронхов начинает активнее выводить слизь и частицы, поэтому в первые недели кашель может временно усилиться. Это часто воспринимается тревожно, но обычно связано с очисткой. Со временем уменьшается одышка, легче переносится ходьба, подъем по лестнице и тренировки. Легкие не становятся новыми за один день, однако каждый день без дыма снижает нагрузку на бронхи и помогает дыханию становиться глубже и спокойнее.' },
            { id: 2, name: 'Сердечно-сосудистая система', icon: 'fa-heart-pulse', color: 'text-red-500 bg-red-50', short: 'Меньше спазма, больше кислорода.', text: 'Сердце и сосуды быстро чувствуют отсутствие никотина и угарного газа. Сосудистый тонус постепенно приходит в более ровное состояние, пульс становится спокойнее, а кровь эффективнее переносит кислород. Снижается лишняя нагрузка на сердце, которая раньше возникала после каждой сигареты. У многих людей улучшается переносимость физической активности, руки и ноги меньше мерзнут, давление становится стабильнее. Самое важное здесь - накопительный эффект: чем дольше период без табака, тем меньше ежедневное повреждение сосудов и выше шанс на долгую выносливость.' },
            { id: 3, name: 'Нервная система', icon: 'fa-brain', color: 'text-purple-500 bg-purple-50', short: 'Перенастройка тяги и дофамина.', text: 'Нервная система привыкает получать быстрый никотиновый сигнал, поэтому первые дни и недели могут быть эмоционально неровными. Раздражительность, тревожность, сонливость или сильная тяга не означают провал: мозг перестраивает систему вознаграждения. Постепенно естественные источники удовольствия снова становятся заметнее: еда, движение, общение, отдых, завершенные дела. Концентрация тоже может восстановиться после периода адаптации. Важно не спорить с тягой напрямую, а пережидать волны, менять контекст и давать мозгу новые повторяющиеся ритуалы без дыма.' },
            { id: 4, name: 'Пищеварительная система', icon: 'fa-apple-whole', color: 'text-orange-500 bg-orange-50', short: 'Вкус, аппетит и спокойный ЖКТ.', text: 'После отказа от курения слизистые оболочки получают меньше токсического и температурного раздражения. Вкус и обоняние часто становятся ярче, поэтому пища кажется насыщеннее. Аппетит может временно усилиться: организм ищет быстрые награды вместо никотина, а привычка держать что-то во рту остается. Полезно заранее добавить воду, белок, овощи и простые перекусы, чтобы не заменить сигареты бесконтрольными сладостями. Пищеварение может перестраиваться несколько недель, но снижение табачной нагрузки обычно помогает желудку, кишечнику и печени работать спокойнее.' },
            { id: 5, name: 'Кожа и внешний вид', icon: 'fa-face-grin-stars', color: 'text-pink-500 bg-pink-50', short: 'Микроциркуляция и свежий цвет лица.', text: 'Кожа особенно чувствительна к качеству кровотока и уровню кислорода. Когда дым исчезает, капилляры получают шанс работать ровнее, а ткани - лучше снабжаться питательными веществами. Со временем может уменьшаться сероватый оттенок лица, быстрее заживают мелкие воспаления, свежее выглядят губы и область вокруг глаз. Волосы и одежда перестают удерживать запах дыма, что тоже сильно меняет ощущение от себя. Внешний эффект не мгновенный, но он хорошо заметен как результат стабильного сна, воды, движения и дней без сигарет.' },
            { id: 6, name: 'Иммунная система', icon: 'fa-shield-virus', color: 'text-emerald-500 bg-emerald-50', short: 'Защита без постоянного дыма.', text: 'Табачный дым поддерживает хроническое раздражение дыхательных путей и мешает нормальной работе защитных барьеров. После отказа иммунной системе проще заниматься обычной задачей: распознавать инфекции, восстанавливать ткани и контролировать воспаление. Простуды не исчезают магически, но дыхательные пути постепенно становятся менее уязвимыми к постоянному химическому стрессу. Важную роль играют сон, питание и движение, потому что иммунитет восстанавливается не отдельной кнопкой, а всем режимом жизни. Отказ от курения убирает один из крупных факторов, который каждый день отвлекал защитные силы организма.' },
            { id: 7, name: 'Эндокринная система', icon: 'fa-vial', color: 'text-indigo-500 bg-indigo-50', short: 'Гормоны стресса и обмен веществ.', text: 'Никотин влияет на гормоны стресса, аппетит и чувствительность тканей к сигналам организма. После отказа тело постепенно выходит из режима постоянных коротких стимуляций. Уровень энергии может колебаться: иногда хочется спать, иногда тянет на сладкое, иногда настроение меняется без очевидной причины. Это часть перестройки обмена веществ и привычек. Ровный режим сна, регулярная еда и умеренная активность помогают эндокринной системе стабилизироваться. Цель не в идеальном контроле веса, а в том, чтобы дать телу спокойно перестроиться без дыма.' },
            { id: 8, name: 'Опорно-двигательный аппарат', icon: 'fa-bone', color: 'text-amber-500 bg-amber-50', short: 'Кости, суставы и восстановление мышц.', text: 'Курение ухудшает кровоснабжение тканей и может мешать восстановлению после нагрузок или травм. Когда табачный дым уходит, мышцы, связки и суставы получают больше шансов на нормальное питание и ремонт. Физическая форма возвращается постепенно: сначала становится легче дышать при ходьбе, затем проще увеличивать дистанцию, темп или силовую нагрузку. Кости и соединительная ткань выигрывают от лучшего обмена, особенно если добавить витамин D, белок и движение по рекомендации врача. Тело начинает восприниматься не как уставший механизм, а как система, которую можно тренировать.' },
            { id: 9, name: 'Репродуктивная система', icon: 'fa-venus-mars', color: 'text-rose-500 bg-rose-50', short: 'Кровоток, гормоны и фертильность.', text: 'Табак влияет на сосуды, гормональный фон и качество репродуктивных клеток. После отказа улучшается кровоснабжение, а организм постепенно снижает воздействие токсинов, связанных с дымом. У мужчин это может поддерживать эректильную функцию и качество спермы, у женщин - общий репродуктивный фон и подготовку к беременности. Особенно важно бросить курить до зачатия и во время беременности, но медицинские решения лучше обсуждать со специалистом. Даже если тема фертильности сейчас не актуальна, репродуктивная система выигрывает от более чистого кровотока и меньшего воспалительного фона.' },
            { id: 10, name: 'Выделительная система', icon: 'fa-droplet', color: 'text-cyan-500 bg-cyan-50', short: 'Почки, мочевой пузырь и детокс.', text: 'Почки и мочевой пузырь участвуют в выведении продуктов обмена, а при курении сталкиваются with дополнительной химической нагрузкой. После отказа организм перестает ежедневно получать новую порцию соединений из табачного дыма, и фильтрационным системам становится легче поддерживать баланс жидкости и солей. Это не означает мгновенную очистку, но снижает постоянное раздражение и долгосрочные риски. Вода, нормальное давление и движение помогают почкам работать стабильнее. Хороший ориентир - не ждать чудесной детоксикации, а ценить отсутствие новой табачной нагрузки каждый день.' }
        ];
        const historyItems = [
            { year: '6000 г. до н.э.', title: 'Первые ритуалы', text: 'Дикий табак растет в Америке задолго до появления европейцев. Археологические находки и этнографические данные связывают его с обрядами, лечением, переговорами и шаманскими практиками. Дым воспринимали не как бытовую привычку, а как символ связи с духами, предками, землей и невидимым порядком мира.' },
            { year: '3000 г. до н.э.', title: 'Одомашнивание растения', text: 'Племена Центральной и Южной Америки постепенно начинают выращивать табак рядом с поселениями. Растение отбирают по крепости, аромату и устойчивости. Его листья сушат, хранят, обменивают и используют в церемониях. Так табак превращается из дикого растения в культурный ресурс с особым статусом.' },
            { year: '1000 г. до н.э.', title: 'Трубки и сосуды', text: 'В разных регионах Америки появляются глиняные и каменные трубки. Они показывают, что употребление табака уже имеет устойчивые формы и правила. Курение остается частью ритуала, но постепенно получает социальные функции: подтверждает союз, сопровождает совет старейшин и отмечает важные переходы в жизни общины.' },
            { year: '500 г.', title: 'Табак майя', text: 'На территории майя табак входит в религиозные изображения, мифы и повседневные практики элит. Его могли курить, жевать или использовать в смесях. Для жрецов дым был знаком обращения к сверхъестественному, а для общества - частью сложной культуры обмена, власти, лечения и символических действий.' },
            { year: '1000 г.', title: 'Североамериканские традиции', text: 'У народов Северной Америки табак становится важным элементом дипломатии и мирных соглашений. Курительная трубка могла сопровождать переговоры, обещания и примирение. В этом контексте табак не был развлечением: его употребление требовало уважения, ограничений и понимания духовного значения каждого жеста.' },
            { year: '1492 г.', title: 'Встреча с Европой', text: 'Экспедиция Христофора Колумба сталкивается с табаком на Карибах. Европейцы видят, как местные жители вдыхают дым сухих листьев, и сначала воспринимают это как странный обычай. Несколько моряков пробуют курение сами, открывая путь растению, которое вскоре изменит экономику, медицину и культуру Европы.' },
            { year: '1518 г.', title: 'Плантации на Кубе', text: 'Испанцы начинают развивать выращивание табака на Карибах. Кубинский климат оказывается особенно подходящим для ароматных сортов. Постепенно табак становится товаром колониальной экономики. Его производство связывается with землей, принудительным трудом, морской торговлей и растущим европейским интересом к новым привычкам.' },
            { year: '1556 г.', title: 'Французское знакомство', text: 'Табак появляется во Франции через путешественников и дипломатов. Сначала его воспринимают как экзотическое лекарственное растение, способное помогать при головной боли, усталости и разных недугах. Медицинские надежды оказываются сильнее осторожности, поэтому табак быстро получает место в садах, аптеках и придворных разговорах.' },
            { year: '1560 г.', title: 'Жан Нико', text: 'Французский посол Жан Нико популяризирует табак при дворе, отправляя его Екатерине Медичи. Его имя позднее даст название никотину. В XVI веке табак еще часто воспринимается как лекарство, а не как источник зависимости, что помогает ему проникнуть в высшие слои европейского общества.' },
            { year: '1571 г.', title: 'Медицинская мода', text: 'Испанский врач Николас Монардес описывает табак как растение with многочисленными лечебными свойствами. Его книга распространяет веру в пользу табака по Европе. Врачи назначают листья, порошок и дым от самых разных болезней. Позднее многие такие представления будут пересмотрены наукой.' },
            { year: '1586 г.', title: 'Табак в Англии', text: 'Английские моряки и колониальные деятели привозят курение в Англию. Сэр Уолтер Рэли становится одной из фигур, связанных with модой на трубку. Табак быстро получает репутацию смелой, заморской привычки. Его обсуждают в тавернах, при дворе и среди торговцев.' },
            { year: '1604 г.', title: 'Гнев Якова I', text: 'Король Англии Яков I публикует знаменитое выступление против табака. Он называет курение вредным для мозга, опасным для легких и неприятным для окружающих. Это один из ранних европейских текстов, где табак осуждается не только морально, но и with явной заботой о здоровье.' },
            { year: '1612 г.', title: 'Вирджинский урожай', text: 'Джон Рольф выращивает в Вирджинии сорт табака, который нравится английскому рынку. Успех меняет судьбу Джеймстауна: табак становится главным экспортным товаром колонии. Экономический рост, землевладение и трудовая эксплуатация оказываются тесно связаны with растущим европейским спросом на курение.' },
            { year: '1620 г.', title: 'Табачная Атлантика', text: 'К началу XVII века табак прочно входит в трансатлантическую торговлю. Листья перевозят кораблями, продают в портах и облагают пошлинами. Вокруг растения складывается сеть фермеров, купцов, чиновников и потребителей. Курение постепенно перестает быть редкостью и становится привычкой многих городских мужчин.' },
            { year: '1634 г.', title: 'Запрет в России', text: 'В России XVII века табак встречает жесткое сопротивление властей и церкви. При Михаиле Романове за курение могли сурово наказывать, связывая его with пожарами, иностранным влиянием и нравственным разложением. Запреты не уничтожают интерес, но делают табак предметом риска и тайной торговли.' },
            { year: '1660 г.', title: 'Табак как валюта', text: 'В английских колониях Северной Америки табак становится настолько ценным товаром, что его используют для расчетов и налогов. Листья служат заменой денег там, где не хватает монеты. Это показывает, насколько глубоко табак вошел в экономику колоний и повседневную жизнь поселенцев.' },
            { year: '1674 г.', title: 'Французская монополия', text: 'Во Франции государство усиливает контроль над табачной торговлей. Монополии и налоги превращают табак в удобный источник доходов для казны. Такая модель позднее повторится во многих странах: власти осуждают вредную привычку, но одновременно получают значительные деньги от ее распространения.' },
            { year: '1697 г.', title: 'Петровская легализация', text: 'Петр I после путешествий по Европе меняет отношение российского государства к табаку. Курение легализуют, а продажу включают в систему доходов. Табак становится частью европеизации быта, армии и двора. Запретная привычка быстро превращается в разрешенный товар with фискальным значением.' },
            { year: '1700 г.', title: 'Плантационный век', text: 'В XVIII веке табак становится одной из опор плантационной экономики Атлантики. Его выращивание требует огромных земель и труда. Спрос в Европе поддерживает расширение рабства, долговой зависимости и колониальной торговли. За модой на трубку и нюхательный табак стоит тяжелая социальная цена.' },
            { year: '1761 г.', title: 'Первое предупреждение', text: 'Английский врач Джон Хилл публикует работу о связи нюхательного табака with раком носовой полости. Это один из ранних примеров медицинской критики табака. Его наблюдения еще не создают массового запрета, но показывают: сомнения о безопасности появились задолго до современной эпидемиологии.' },
            { year: '1776 г.', title: 'Табак и революция', text: 'Во время Американской революции табак остается важнейшим экспортным ресурсом. Он помогает колониям получать кредиты, вести расчеты и поддерживать внешнюю торговлю. Политическая борьба за независимость переплетается with аграрной экономикой, где табачные плантации играют заметную, хотя противоречивую роль.' },
            { year: '1791 г.', title: 'Акцизы Гамильтона', text: 'В США Александр Гамильтон предлагает налоги на товары массового потребления, включая табак. Государства быстро понимают, что никотиновая привычка дает стабильные бюджетные поступления. Так формируется долговечный конфликт: общественное здоровье требует ограничения, а финансовые системы привыкают к доходам от продаж.' },
            { year: '1828 г.', title: 'Выделение никотина', text: 'Немецкие химики Вильгельм Поссельт и Карл Рейманн выделяют никотин из табачных листьев. Вещество описывают как сильный яд, действующий на нервную систему. Это важный шаг от бытовых наблюдений к химическому пониманию табака и механизма его зависимости.' },
            { year: '1830 г.', title: 'Сигары и города', text: 'В XIX веке сигары становятся популярны в европейских и американских городах. Их курят в клубах, кабинетах, гостиницах и деловых пространствах. Сигара связывается with мужской солидностью, властью и достатком. Табак все сильнее становится языком социального образа, а не только привычкой.' },
            { year: '1843 г.', title: 'Первые папиросы', text: 'Во Франции и Испании распространяются ранние формы бумажных сигарет и папирос. Они дешевле, легче и быстрее трубок или сигар. Новый формат подходит городской жизни, армии и рабочим перерывам. Именно удобство позже сделает сигарету главным носителем никотиновой зависимости.' },
            { year: '1856 г.', title: 'Крымская война', text: 'Крымская война помогает распространить бумажные сигареты среди европейских солдат. Военные перенимают привычки союзников и противников, а после возвращения домой сохраняют новый способ курения. Армия становится мощным каналом культурного обмена, где табак закрепляется как спутник стресса, ожидания и товарищества.' },
            { year: '1865 г.', title: 'После Гражданской войны', text: 'В США после Гражданской войны табак становится еще более массовым. Ветераны возвращаются with привычкой к сигаретам и жевательному табаку. Производители расширяют рынок, используя упаковку, бренды и рекламу. Курение постепенно перестает быть региональной особенностью и входит в национальную культуру.' },
            { year: '1881 г.', title: 'Машина Бонсака', text: 'Джеймс Бонсак патентует машину для массовой скрутки сигарет. Производительность резко растет, а себестоимость падает. Сигарета становится дешевым, одинаковым и удобным продуктом. Индустриализация меняет масштаб проблемы: никотин теперь можно продавать миллионами штук ежедневно, поддерживая зависимость регулярной доступностью.' },
            { year: '1889 г.', title: 'Рекламные карточки', text: 'Табачные компании активно используют коллекционные карточки, яркие пачки и печатную рекламу. Бренд становится не менее важен, чем сам лист. Покупатель получает историю, образ и принадлежность к стилю. Так табачная индустрия одной из первых осваивает современный массовый маркетинг.' },
            { year: '1900 г.', title: 'Сигаретный век', text: 'К началу XX века сигареты начинают вытеснять трубки, сигары и нюхательный табак. Они удобны для фабрик, офисов, улиц и транспорта. Быстрый темп городской жизни делает короткий перекур привычным ритуалом. Табак перестраивается под индустриальное общество и его расписание.' },
            { year: '1914 г.', title: 'Окопная привычка', text: 'Первая мировая война резко увеличивает распространение сигарет. Их включают в посылки, пайки и благотворительные наборы для солдат. Курение помогает справляться со страхом, холодом и ожиданием. После войны миллионы мужчин возвращаются домой with привычкой, которую индустрия превращает в постоянный рынок.' },
            { year: '1920 г.', title: 'Кино и дым', text: 'Немое и раннее звуковое кино делает сигарету выразительным жестом. Дым показывает усталость, власть, тревогу, соблазн или независимость. Зрители перенимают не только истории, но и позы героев. Табак становится частью визуального языка массовой культуры и городской романтики.' },
            { year: '1929 г.', title: 'Факелы свободы', text: 'В США табачная реклама начинает активно обращаться к женщинам. Кампании связывают сигарету with независимостью, стройностью и современным образом жизни. Один из известных символов эпохи - акция with «факелами свободы». Маркетинг превращает вредную привычку в обещание личной эмансипации.' },
            { year: '1939 г.', title: 'Ранние антитабачные кампании', text: 'В первой половине XX века в разных странах появляются медицинские и моральные кампании против курения. Особенно заметны исследования и ограничения в Германии конца 1930-х годов. Их наследие противоречиво из-за политического контекста, но научный интерес к вреду табака становится более системным.' },
            { year: '1942 г.', title: 'Вторая мировая война', text: 'Во Вторую мировую войну сигареты снова сопровождают солдат на фронте. Они входят в пайки, служат предметом обмена и способом короткого отдыха. Производители укрепляют эмоциональную связь брендов with мужеством и службой. После войны эта привычка возвращается в мирную повседневность.' },
            { year: '1950 г.', title: 'Долл и Хилл', text: 'Ричард Долл и Остин Брэдфорд Хилл публикуют исследование, связывающее курение with раком легких. Примерно в то же время появляются и другие важные эпидемиологические работы. Для табачной индустрии это опасный момент: вред становится не подозрением, а статистически убедительным фактом.' },
            { year: '1954 г.', title: 'Иллюзия фильтра', text: 'После тревожных исследований компании активно продвигают сигареты with фильтром. Реклама обещает мягкость, чистоту и безопасность, хотя риск для здоровья остается значительным. Фильтр помогает не столько решить проблему, сколько успокоить потребителя. Так индустрия отвечает на науку дизайнерским и маркетинговым ходом.' },
            { year: '1964 г.', title: 'Доклад хирурга США', text: 'Генеральный хирург США публикует доклад о последствиях курения для здоровья. Документ становится поворотным моментом: государственная медицина официально признает связь сигарет with раком легких и другими болезнями. После этого общественная дискуссия меняется, а регулирование постепенно становится жестче.' },
            { year: '1970 г.', title: 'Предупреждения на пачках', text: 'В США и других странах усиливаются требования к предупреждениям о вреде курения. Пачка перестает быть только рекламной поверхностью и становится носителем медицинского сообщения. Табачные компании сопротивляются, но государство постепенно закрепляет право потребителя видеть риск прямо на товаре.' },
            { year: '1971 г.', title: 'Реклама уходит with ТВ', text: 'Запреты телевизионной рекламы сигарет в США и ряде других стран меняют стратегию индустрии. Бренды переходят в спонсорство спорта, музыку, журналы и наружную рекламу. Курение уже нельзя так свободно продавать через семейный экран, но маркетинговая машина ищет новые обходные пути.' },
            { year: '1984 г.', title: 'Глобальный день без табака', text: 'Международные организации усиливают борьбу with курением, а Всемирный день без табака становится заметным символом профилактики. Кампании объясняют вред пассивного дыма, зависимость и выгоды отказа. Общественное здоровье постепенно выходит из кабинетов врачей в школы, медиа, транспорт и рабочие места.' },
            { year: '1988 г.', title: 'Никотин и зависимость', text: 'Доклады органов здравоохранения подробно описывают никотин как вещество, вызывающее зависимость. Это меняет язык дискуссии: курение все меньше считают просто слабостью характера или привычкой. На первый план выходит биология зависимости, маркетинговое удержание потребителя и необходимость помощи при отказе.' },
            { year: '1990 г.', title: 'Самолеты без дыма', text: 'Авиакомпании и государства начинают вводить запреты на курение во время полетов. Пассажиры впервые массово ощущают право на воздух без табачного дыма в замкнутом пространстве. Этот опыт становится моделью для ресторанов, офисов, поездов и других общественных мест.' },
            { year: '1994 г.', title: 'Слушания в Конгрессе', text: 'Руководители крупных табачных компаний выступают перед Конгрессом США и отрицают, что никотин вызывает зависимость. Позднее внутренние документы индустрии показывают глубокое знание проблемы. Слушания становятся символом конфликта между публичными заявлениями бизнеса и реальными научными данными.' },
            { year: '1998 г.', title: 'Master Settlement Agreement', text: 'Крупнейшие табачные компании США заключают соглашение со штатами на сотни миллиардов долларов. Деньги должны компенсировать медицинские расходы, связанные with курением. Соглашение также ограничивает часть рекламы и раскрывает документы индустрии. Эпоха полной безнаказанности табачного бизнеса заканчивается.' },
            { year: '2003 г.', title: 'Конвенция ВОЗ', text: 'Всемирная организация здравоохранения принимает Рамочную конвенцию по борьбе против табака. Это первый глобальный договор общественного здоровья такого масштаба. Он поддерживает налоги, запреты рекламы, предупреждения на пачках и защиту от пассивного дыма, превращая антитабачную политику в международный стандарт.' },
            { year: '2007 г.', title: 'Помещения без дыма', text: 'Многие страны Европы, Америки и Азии вводят запреты курения в барах, ресторанах и на рабочих местах. Сначала меры вызывают споры, но быстро становятся новой нормой. Общество привыкает, что право не вдыхать чужой дым важнее традиции курить в помещении.' },
            { year: '2012 г.', title: 'Простая упаковка', text: 'Австралия вводит стандартизированную упаковку сигарет без ярких логотипов и фирменных цветов. Цель - лишить пачку рекламной силы, особенно для подростков. Опыт внимательно изучают другие страны. Табачный бренд теряет часть визуальной привлекательности, а медицинское предупреждение становится главным элементом упаковки.' },
            { year: '2020 г.', title: 'Пандемия и легкие', text: 'Пандемия COVID-19 усиливает внимание к здоровью дыхательной системы. Многие курильщики впервые воспринимают легкие как уязвимый ресурс, а отказ от табака - как практическую защиту. Медицинские службы расширяют дистанционные консультации, линии поддержки и цифровые инструменты для людей, решивших бросить.' },
            { year: '2024 г.', title: 'Новая личная история', text: 'Сегодня отказ от курения все чаще воспринимается не как запрет, а как возвращение контроля над телом, временем и деньгами. История табака огромна, но личный выбор начинается with конкретного дня. Каждый счетчик без дыма превращает мировую проблему в индивидуальную победу.' },
            { year: '2026 г.', title: 'Прогноз: экологический счет', text: 'Вероятно, борьба with табаком все чаще будет включать не только медицину, но и экологию. Фильтры, упаковка и одноразовые устройства могут стать объектом новых сборов и запретов. Курение будут обсуждать как источник микропластика, мусора, пожаров и затрат городских служб.' },
            { year: '2028 г.', title: 'Прогноз: цифровая помощь', text: 'К концу десятилетия приложения для отказа от курения могут стать намного умнее. Вместо простого счетчика они будут учитывать настроение, сон, стресс, геолокационные триггеры и привычные моменты тяги. Поддержка станет более персональной, а срыв будет предупреждаться до того, как человек потянется за сигаретой.' },
            { year: '2030 г.', title: 'Прогноз: поколение без табака', text: 'Некоторые страны могут приблизиться к цели smoke-free, где курит меньше пяти процентов взрослого населения. Табак окончательно потеряет образ взрослости и бунта. Для подростков сигарета станет скорее устаревшим предметом из прошлого, чем символом свободы, статуса или принадлежности к компании.' },
            { year: '2032 г.', title: 'Прогноз: лечение зависимости', text: 'Медицина зависимости, вероятно, станет точнее. Генетические тесты, поведенческие данные и нейробиология помогут подбирать терапию индивидуально: кому-то подойдут никотинзамещающие средства, кому-то лекарства, кому-то психотерапия и цифровой наставник. Отказ от курения перестанет быть одиночной борьбой на силе воли.' },
            { year: '2035 г.', title: 'Прогноз: перезапуск индустрии', text: 'Табачные корпорации, вероятно, будут все активнее уходить от классических сигарет к никотиновым продуктам, фарме и технологиям снижения вреда. Главный конфликт сохранится: бизнес будет говорить о трансформации, а врачи и регуляторы будут проверять, не продается ли старая зависимость в новой упаковке.' },
            { year: '2040 г.', title: 'Прогноз: музей дыма', text: 'К 2040 году курение в помещениях может казаться молодым людям почти невероятной нормой прошлого. Пачки, пепельницы в самолетах и реклама сигарет станут музейными предметами. Летопись табака будет читаться как история того, как общество долго училось защищать воздух и здоровье.' }

            { id: 8, title: '48 hours', goal: 48 * 60 * 60 * 1000, icon: 'fa-seedling', desc: 'After two days, tastes and smells may become brighter. Nerve endings are moving away from constant tobacco irritation. Notice simple things: food aroma, cleaner breath, and the absence of smoke on your hands and clothes.' },
            { id: 9, title: '72 hours', goal: 72 * 60 * 60 * 1000, icon: 'fa-person-walking', desc: 'Three days is a powerful psychological mark. Breathing may feel easier for some people, although coughing can temporarily increase as airways clear. The hardest part no longer feels theoretical: you have already crossed real craving waves.' },
            { id: 10, title: '4 days', goal: 4 * 24 * 60 * 60 * 1000, icon: 'fa-mug-hot', desc: 'Life begins without old pairings: coffee and a cigarette, stress and a cigarette, a pause and a cigarette. Every broken link weakens the dependence. Replace not only nicotine, but the whole behavioral script.' },
            { id: 11, title: '5 days', goal: 5 * 24 * 60 * 60 * 1000, icon: 'fa-bolt', desc: 'Energy may move in waves: alertness, then fatigue. This is normal while sleep, appetite, and the nervous system adjust. Do not demand perfect wellbeing from yourself. Five days without cigarettes is already serious work.' },
            { id: 12, title: '1 week', goal: 7 * 24 * 60 * 60 * 1000, icon: 'fa-calendar-check', desc: 'A week without smoke is no accident. You have handled work, home, and emotional situations without the old automatic response. Now identify your strongest triggers and prepare simple answers before they appear again.' },

            { id: 14, title: '2 weeks', goal: 14 * 24 * 60 * 60 * 1000, icon: 'fa-heart-pulse', desc: 'Two weeks give your body a noticeable break. Circulation and breathing keep adapting, and confidence grows through repetition. You are no longer just quitting smoking. You are building a new normal.' },
            { id: 15, title: '3 weeks', goal: 21 * 24 * 60 * 60 * 1000, icon: 'fa-dumbbell', desc: 'Physical effort may start to feel easier, especially with walks or gentle training. Your body is learning to work without smoke breaks and oxygen debt. Do not chase records yet: stability matters more than a dramatic push.' },
            { id: 16, title: '1 month', goal: 30 * 24 * 60 * 60 * 1000, icon: 'fa-medal', desc: 'One month without cigarettes is a strong milestone. Many rituals have already weakened, and breathing, sleep, or skin may send encouraging signals. If craving appears, it is not failure. It is a reminder to reinforce your new life.' },
            { id: 17, title: '6 weeks', goal: 42 * 24 * 60 * 60 * 1000, icon: 'fa-shield-alt', desc: 'In six weeks you have collected a lot of evidence of your own steadiness. The body receives less toxic pressure, and the mind sees that stress can be handled differently. Strengthen protective habits; do not test yourself with a cigarette.' },
            { id: 18, title: '2 months', goal: 60 * 24 * 60 * 60 * 1000, icon: 'fa-lungs', desc: 'The airways continue recovering from constant irritation. Stairs, faster walks, or mornings may feel lighter. A good comparison is not with an ideal version of yourself, but with the first day you stopped smoking.' },
            { id: 19, title: '10 weeks', goal: 70 * 24 * 60 * 60 * 1000, icon: 'fa-fire', desc: 'Old triggers can appear unexpectedly: celebration, fatigue, conflict, alcohol. But now you have experience moving through them. Ten weeks show that dependence weakens quietly, through repeated wins rather than one dramatic moment.' },
            { id: 20, title: '3 months', goal: 90 * 24 * 60 * 60 * 1000, icon: 'fa-route', desc: 'Three months is a real distance, not a starting sprint. Circulation, endurance, and daily breathing often feel noticeably better. Self-image changes too: you can see yourself as someone who finishes an important decision.' },

            { id: 22, title: '5 months', goal: 150 * 24 * 60 * 60 * 1000, icon: 'fa-person-hiking', desc: 'Five months without smoke helps the body get used to a more active life. Even ordinary walking may become more enjoyable because breathing no longer hits fatigue so quickly. Choose a form of movement you actually like.' },
            { id: 23, title: '6 months', goal: 180 * 24 * 60 * 60 * 1000, icon: 'fa-mountain', desc: 'Half a year is a major landmark. Craving may be rare, but sometimes very convincing in old situations. Do not treat calm as permission for one cigarette. Six months matter because the chain stayed unbroken.' },
            { id: 24, title: '7 months', goal: 210 * 24 * 60 * 60 * 1000, icon: 'fa-comments', desc: 'You can already become an example for others, even quietly. People notice steadiness, smell, energy, and calm. Your quit story becomes part of who you are: not a slogan, but quiet evidence of change.' },
            { id: 25, title: '8 months', goal: 240 * 24 * 60 * 60 * 1000, icon: 'fa-bed', desc: 'Sleep and recovery may become more stable if other factors allow it. The body no longer receives evening nicotine jolts and nightly consequences of smoke. Good sleep strengthens mood, appetite, immunity, and the ability to avoid relapse.' },
            { id: 26, title: '9 months', goal: 270 * 24 * 60 * 60 * 1000, icon: 'fa-tree', desc: 'After nine months many people feel their airways are noticeably freer. Coughing and breathlessness may decrease, especially with regular movement. This is not magic; it is the result of long absence of smoke.' },
