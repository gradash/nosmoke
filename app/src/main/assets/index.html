            { id: 1, name: 'Respiratory System', icon: 'fa-lungs', color: 'text-blue-500 bg-blue-50', short: 'Clearing airways and easier breathing.', text: 'After quitting, the airways gradually escape constant irritation. The ciliated lining of the bronchi starts moving mucus and particles more actively, so coughing can temporarily increase during the first weeks. That may feel worrying, but it is often part of clearing. Over time, breathlessness may decrease and walking, stairs, and training can feel easier. Lungs do not become new overnight, yet every smoke-free day lowers the burden on the bronchi and helps breathing become deeper and calmer.' },
            { id: 2, name: 'Cardiovascular System', icon: 'fa-heart-pulse', color: 'text-red-500 bg-red-50', short: 'Less spasm, more oxygen.', text: 'The heart and blood vessels quickly notice the absence of nicotine and carbon monoxide. Vascular tone gradually becomes steadier, pulse may calm down, and blood carries oxygen more efficiently. The heart no longer receives the extra strain that followed every cigarette. Many people feel better tolerance for movement, warmer hands and feet, or more stable pressure. The key is the cumulative effect: the longer the smoke-free period, the less daily vessel damage and the better the chance of lasting endurance.' },
            { id: 3, name: 'Nervous System', icon: 'fa-brain', color: 'text-purple-500 bg-purple-50', short: 'Rewiring craving and dopamine.', text: 'The nervous system is used to fast nicotine signals, so the first days and weeks can feel uneven. Irritability, anxiety, sleepiness, or strong craving do not mean failure: the brain is recalibrating its reward system. Natural pleasures slowly become more noticeable again: food, movement, conversation, rest, completed tasks. Focus may also recover after adaptation. Do not fight every craving head-on; wait out the waves, change context, and give the brain new repeated rituals without smoke.' },
            { id: 4, name: 'Digestive System', icon: 'fa-apple-whole', color: 'text-orange-500 bg-orange-50', short: 'Taste, appetite, and calmer digestion.', text: 'After quitting, mucous membranes receive less toxic and thermal irritation. Taste and smell often become brighter, so food may feel richer. Appetite can temporarily increase because the body seeks quick rewards instead of nicotine, and the habit of keeping something in the mouth remains. Prepare water, protein, vegetables, and simple snacks so cigarettes are not replaced by uncontrolled sweets. Digestion may readjust for several weeks, but lower tobacco exposure usually helps the stomach, gut, and liver work more calmly.' },
            { id: 5, name: 'Skin and Appearance', icon: 'fa-face-grin-stars', color: 'text-pink-500 bg-pink-50', short: 'Microcirculation and fresher skin.', text: 'Skin is sensitive to blood flow and oxygen. When smoke disappears, capillaries get a chance to work more evenly, and tissues receive better nourishment. Over time, a grayish facial tone may fade, small inflammations may heal faster, and lips and the eye area can look fresher. Hair and clothes stop holding smoke smell, which strongly changes how you feel about yourself. The effect is not instant, but it becomes visible through sleep, water, movement, and smoke-free days.' },
            { id: 6, name: 'Immune System', icon: 'fa-shield-virus', color: 'text-emerald-500 bg-emerald-50', short: 'Protection without constant smoke.', text: 'Tobacco smoke maintains chronic airway irritation and disrupts protective barriers. After quitting, the immune system can focus more on its normal work: recognizing infections, repairing tissues, and controlling inflammation. Colds do not disappear magically, but airways become less exposed to daily chemical stress. Sleep, nutrition, and movement matter because immunity does not recover through one switch, but through the whole routine. Quitting removes one major factor that distracted the body’s defenses every day.' },
            { id: 7, name: 'Endocrine System', icon: 'fa-vial', color: 'text-indigo-500 bg-indigo-50', short: 'Stress hormones and metabolism.', text: 'Nicotine affects stress hormones, appetite, and how tissues respond to the body’s signals. After quitting, the body gradually leaves the cycle of short repeated stimulation. Energy can fluctuate: sometimes sleepiness, sometimes sugar cravings, sometimes mood changes without an obvious reason. This is part of metabolic and habit readjustment. Regular sleep, steady meals, and moderate activity help the endocrine system settle. The goal is not perfect weight control, but giving the body space to recalibrate without smoke.' },
            { id: 8, name: 'Musculoskeletal System', icon: 'fa-bone', color: 'text-amber-500 bg-amber-50', short: 'Bones, joints, and muscle recovery.', text: 'Smoking worsens tissue blood supply and can interfere with recovery after exertion or injury. Once tobacco smoke is gone, muscles, ligaments, and joints get better chances for nourishment and repair. Fitness returns gradually: first walking feels easier, then distance, pace, or strength work can increase. Bones and connective tissue benefit from better metabolism, especially with vitamin D, protein, and movement when medically appropriate. The body begins to feel less like a tired mechanism and more like a system that can be trained.' },
            { id: 9, name: 'Reproductive System', icon: 'fa-venus-mars', color: 'text-rose-500 bg-rose-50', short: 'Blood flow, hormones, and fertility.', text: 'Tobacco affects blood vessels, hormones, and the quality of reproductive cells. After quitting, circulation improves and the body gradually reduces exposure to smoke-related toxins. In men this may support erectile function and sperm quality; in women it may support reproductive health and pregnancy preparation. It is especially important to stop before conception and during pregnancy, while medical decisions should be discussed with a clinician. Even when fertility is not the focus, the reproductive system benefits from cleaner blood flow and less inflammatory pressure.' },
            { id: 10, name: 'Urinary System', icon: 'fa-droplet', color: 'text-cyan-500 bg-cyan-50', short: 'Kidneys, bladder, and detox load.', text: 'The kidneys and bladder help remove metabolic waste, and smoking adds extra chemical load. After quitting, the body stops receiving a daily dose of compounds from tobacco smoke, making it easier for filtration systems to maintain fluid and salt balance. This does not mean instant cleansing, but it reduces constant irritation and long-term risks. Water, normal blood pressure, and movement support kidney stability. The useful mindset is not expecting a miracle detox, but valuing the absence of new tobacco burden every day.' }
        ];
        const historyItemsEn = [
            { year: '6000 BCE', title: 'First Rituals', text: 'Wild tobacco grew in the Americas long before Europeans arrived. Archaeology and ethnography connect it with ceremony, healing, negotiation, and shamanic practice. Smoke was not a casual habit, but a symbol of contact with spirits, ancestors, the land, and the unseen order of the world.' },
            { year: '3000 BCE', title: 'Domestication', text: 'Communities in Central and South America gradually began cultivating tobacco near settlements. Plants were selected for strength, aroma, and resilience. Leaves were dried, stored, exchanged, and used ceremonially. Tobacco moved from wild plant to cultivated resource with a special social and spiritual status.' },
            { year: '1000 BCE', title: 'Pipes and Vessels', text: 'Clay and stone pipes appeared in different parts of the Americas. They show that tobacco use already had stable forms and rules. Smoking remained ritual, but gained social functions: sealing alliances, accompanying councils, and marking important transitions in community life.' },
            { year: '500', title: 'Tobacco Among the Maya', text: 'In Maya culture, tobacco appeared in religious imagery, myths, and elite practice. It could be smoked, chewed, or mixed with other substances. For priests, smoke signaled contact with the supernatural; for society, it belonged to exchange, authority, healing, and symbolic action.' },
            { year: '1000', title: 'North American Traditions', text: 'Among many North American peoples, tobacco became important in diplomacy and peacemaking. A ceremonial pipe could accompany negotiation, promises, and reconciliation. Tobacco was not mere entertainment: its use required respect, restraint, and understanding of the meaning behind each gesture.' },
            { year: '1492', title: 'Encounter with Europe', text: 'Christopher Columbus’s expedition encountered tobacco in the Caribbean. Europeans saw local people inhaling smoke from dried leaves and first treated it as a strange custom. Some sailors tried it themselves, opening the path for a plant that would reshape European medicine, trade, and culture.' },
            { year: '1518', title: 'Cuban Plantations', text: 'Spanish colonists began developing tobacco cultivation in the Caribbean. Cuba’s climate proved especially suited to aromatic varieties. Tobacco slowly became a colonial commodity, tied to land, forced labor, maritime trade, and the growing European appetite for new habits.' },
            { year: '1556', title: 'France Discovers Tobacco', text: 'Tobacco reached France through travelers and diplomats. At first it was treated as an exotic medicinal plant, supposedly useful for headaches, fatigue, and many illnesses. Medical hope outweighed caution, giving tobacco a place in gardens, pharmacies, and court conversation.' },
            { year: '1560', title: 'Jean Nicot', text: 'French ambassador Jean Nicot popularized tobacco at court by sending it to Catherine de Medici. His name later gave nicotine its name. In the sixteenth century, tobacco was still often seen as medicine rather than a source of dependence.' },
            { year: '1571', title: 'Medical Fashion', text: 'Spanish physician Nicolas Monardes described tobacco as a plant with many healing properties. His book spread belief in tobacco’s benefits across Europe. Doctors prescribed leaves, powder, and smoke for many conditions. Later science would overturn many of those claims.' },
            { year: '1586', title: 'Tobacco in England', text: 'English sailors and colonial figures brought smoking to England. Sir Walter Raleigh became one of the names associated with pipe fashion. Tobacco quickly gained the aura of a bold overseas habit, discussed in taverns, at court, and among merchants.' },
            { year: '1604', title: 'James I Objects', text: 'King James I of England published a famous attack on tobacco. He called smoking harmful to the brain, dangerous to the lungs, and unpleasant to others. It was an early European text condemning tobacco with concern for health as well as morals.' },
            { year: '1612', title: 'Virginia’s Crop', text: 'John Rolfe grew a tobacco variety in Virginia that appealed to the English market. The success transformed Jamestown: tobacco became the colony’s main export. Growth, land ownership, and labor exploitation became tightly linked to European demand for smoking.' },
            { year: '1620', title: 'The Tobacco Atlantic', text: 'By the early seventeenth century, tobacco was firmly part of Atlantic trade. Leaves moved by ship, sold in ports, and were taxed by governments. Around the plant emerged farmers, merchants, officials, and consumers. Smoking was becoming a common urban habit.' },
            { year: '1634', title: 'Russian Prohibition', text: 'In seventeenth-century Russia, tobacco met fierce resistance from the state and church. Under Mikhail Romanov, smoking could be punished harshly and linked with fires, foreign influence, and moral decline. Prohibition did not erase interest, but made tobacco risky and illicit.' },
            { year: '1660', title: 'Tobacco as Currency', text: 'In English North American colonies, tobacco became valuable enough to be used for payments and taxes. Leaves could substitute for scarce coin. This shows how deeply tobacco entered colonial economics and the everyday life of settlers.' },
            { year: '1674', title: 'French Monopoly', text: 'France strengthened state control over the tobacco trade. Monopolies and taxes turned tobacco into a convenient source of public revenue. Many countries later repeated the pattern: governments criticized a harmful habit while collecting significant income from its spread.' },
            { year: '1697', title: 'Peter the Great Legalizes It', text: 'After his travels in Europe, Peter I changed Russia’s official attitude toward tobacco. Smoking was legalized, and sales became part of state revenue. Tobacco joined the Europeanization of manners, army life, and court culture.' },
            { year: '1700', title: 'The Plantation Century', text: 'In the eighteenth century, tobacco became a pillar of the Atlantic plantation economy. Its cultivation required land and labor. European demand supported slavery, debt dependency, and colonial trade. Behind fashionable pipes and snuff lay a heavy social cost.' },
            { year: '1761', title: 'An Early Warning', text: 'English physician John Hill published work linking snuff with cancer of the nasal passages. It was an early example of medical criticism of tobacco. His observations did not create mass prohibition, but they showed that doubts appeared long before modern epidemiology.' },
            { year: '1776', title: 'Tobacco and Revolution', text: 'During the American Revolution, tobacco remained a crucial export. It helped colonies obtain credit, settle accounts, and maintain foreign trade. The political struggle for independence was intertwined with an agricultural economy in which tobacco plantations played a major role.' },
            { year: '1791', title: 'Hamilton’s Excises', text: 'In the United States, Alexander Hamilton supported taxes on mass-consumption goods, including tobacco. Governments quickly learned that nicotine habits produced reliable revenue. A long conflict formed between public health goals and financial systems accustomed to tobacco income.' },
            { year: '1828', title: 'Nicotine Isolated', text: 'German chemists Wilhelm Posselt and Karl Reimann isolated nicotine from tobacco leaves. They described it as a powerful poison acting on the nervous system. This was an important step from everyday observation to chemical understanding of tobacco and dependence.' },
            { year: '1830', title: 'Cigars and Cities', text: 'In the nineteenth century, cigars became popular in European and American cities. They were smoked in clubs, offices, hotels, and business spaces. Cigars became associated with masculinity, power, and wealth, turning tobacco into a language of social image.' },
            { year: '1843', title: 'Early Cigarettes', text: 'In France and Spain, early paper cigarettes and papirosy spread. They were cheaper, lighter, and faster than pipes or cigars. The new format suited cities, armies, and work breaks. Convenience later made the cigarette the main carrier of nicotine dependence.' },
            { year: '1856', title: 'The Crimean War', text: 'The Crimean War helped spread paper cigarettes among European soldiers. Troops borrowed habits from allies and enemies, then carried them home. The army became a powerful channel of cultural exchange, where tobacco attached itself to stress, waiting, and comradeship.' },
            { year: '1865', title: 'After the Civil War', text: 'After the American Civil War, tobacco became even more widespread in the United States. Veterans returned with habits of cigarettes and chewing tobacco. Manufacturers expanded markets through packaging, brands, and advertising, making smoking part of national culture.' },
            { year: '1881', title: 'Bonsack’s Machine', text: 'James Bonsack patented a machine for mass-producing cigarettes. Output rose sharply and costs fell. The cigarette became cheap, uniform, and convenient. Industrialization changed the scale of the problem: nicotine could now be sold by the millions each day.' },
            { year: '1889', title: 'Advertising Cards', text: 'Tobacco companies used collectible cards, bright packs, and printed advertising. Brand became almost as important as leaf. Buyers received a story, an image, and a sense of belonging. The tobacco industry became an early master of mass marketing.' },
            { year: '1900', title: 'The Cigarette Century', text: 'By the start of the twentieth century, cigarettes began overtaking pipes, cigars, and snuff. They suited factories, offices, streets, and transport. The fast rhythm of urban life made the short smoke break a daily ritual.' },
            { year: '1914', title: 'The Trench Habit', text: 'World War I greatly increased cigarette use. Cigarettes were included in parcels, rations, and aid packages for soldiers. Smoking helped with fear, cold, and waiting. After the war, millions of men returned home with a habit industry could keep selling.' },
            { year: '1920', title: 'Cinema and Smoke', text: 'Silent and early sound cinema turned the cigarette into an expressive gesture. Smoke could show fatigue, power, anxiety, seduction, or independence. Audiences copied not only stories, but poses. Tobacco became part of mass culture’s visual language.' },
            { year: '1929', title: 'Torches of Freedom', text: 'American tobacco advertising began targeting women aggressively. Campaigns linked cigarettes with independence, slimness, and modern life. One famous symbol was the “torches of freedom” campaign. Marketing turned a harmful habit into a promise of emancipation.' },
            { year: '1939', title: 'Early Anti-Tobacco Campaigns', text: 'In the first half of the twentieth century, medical and moral campaigns against smoking appeared in several countries. Research and restrictions in late-1930s Germany were especially visible, though politically compromised. Scientific interest in tobacco harm became more systematic.' },
            { year: '1942', title: 'World War II', text: 'During World War II, cigarettes again accompanied soldiers at the front. They were part of rations, exchange, and short rest. Producers strengthened emotional links between brands, courage, and service. After the war, the habit returned to peacetime life.' },
            { year: '1950', title: 'Doll and Hill', text: 'Richard Doll and Austin Bradford Hill published research linking smoking with lung cancer. Other important epidemiological studies appeared around the same time. For the tobacco industry, this was dangerous: harm was becoming not suspicion, but statistically convincing evidence.' },
            { year: '1954', title: 'The Filter Illusion', text: 'After alarming studies, companies heavily promoted filter cigarettes. Advertising promised mildness, cleanliness, and safety, while health risks remained substantial. Filters did not solve the problem so much as reassure consumers. Industry answered science with design and marketing.' },
            { year: '1964', title: 'The Surgeon General’s Report', text: 'The U.S. Surgeon General published a landmark report on the health consequences of smoking. Government medicine officially recognized the link between cigarettes, lung cancer, and other diseases. Public debate changed, and regulation gradually became stronger.' },
            { year: '1970', title: 'Warnings on Packs', text: 'The United States and other countries strengthened requirements for health warnings on cigarette packs. The pack was no longer only an advertising surface; it became a carrier of medical information. Governments asserted the consumer’s right to see risk on the product.' },
            { year: '1971', title: 'Advertising Leaves TV', text: 'Bans on television cigarette advertising in the United States and elsewhere changed industry strategy. Brands moved into sports sponsorship, music, magazines, and outdoor advertising. Smoking could no longer be sold as freely through the family screen, but marketing found new routes.' },
            { year: '1984', title: 'A Global No Tobacco Day', text: 'International organizations intensified tobacco control, and World No Tobacco Day became a visible symbol of prevention. Campaigns explained secondhand smoke, dependence, and the benefits of quitting. Public health moved into schools, media, transport, and workplaces.' },
            { year: '1988', title: 'Nicotine and Dependence', text: 'Health reports described nicotine in detail as an addictive substance. The language changed: smoking was less often seen as mere weakness or habit. Biology of dependence, consumer retention, and the need for quit support came to the foreground.' },
            { year: '1990', title: 'Smoke-Free Skies', text: 'Airlines and governments began introducing bans on smoking during flights. Passengers experienced a mass right to air without tobacco smoke in enclosed spaces. This became a model for restaurants, offices, trains, and other public places.' },
            { year: '1994', title: 'Congressional Hearings', text: 'Leaders of major tobacco companies testified before the U.S. Congress and denied that nicotine was addictive. Later internal documents showed deep knowledge of the problem. The hearings became a symbol of conflict between public claims and scientific reality.' },
            { year: '1998', title: 'Master Settlement Agreement', text: 'Major U.S. tobacco companies reached a settlement with states worth hundreds of billions of dollars. The money was meant to compensate smoking-related medical costs. The agreement also limited some advertising and released industry documents, ending an era of impunity.' },
            { year: '2003', title: 'WHO Convention', text: 'The World Health Organization adopted the Framework Convention on Tobacco Control. It became the first global public-health treaty of this scale. It supported taxes, advertising bans, pack warnings, and protection from secondhand smoke as international standards.' },
            { year: '2007', title: 'Smoke-Free Interiors', text: 'Many countries introduced bans on smoking in bars, restaurants, and workplaces. At first the measures caused debate, but quickly became normal. Society grew used to the idea that the right not to inhale smoke outweighed the tradition of indoor smoking.' },
            { year: '2012', title: 'Plain Packaging', text: 'Australia introduced standardized cigarette packaging without bright logos or brand colors. The aim was to remove the pack’s advertising power, especially for teenagers. Other countries studied the model. The health warning became the dominant visual element.' },
            { year: '2020', title: 'Pandemic and Lungs', text: 'The COVID-19 pandemic increased attention to respiratory health. Many smokers saw the lungs as a vulnerable resource and quitting as practical protection. Health services expanded remote consultations, support lines, and digital tools for people deciding to stop.' },
            { year: '2024', title: 'A New Personal Story', text: 'Today, quitting smoking is increasingly seen not as prohibition, but as regaining control over body, time, and money. Tobacco history is vast, yet personal choice begins on a specific day. Every smoke-free counter turns a global issue into an individual victory.' },
            { year: '2026', title: 'Forecast: Environmental Cost', text: 'Tobacco control will likely include ecology as well as medicine. Filters, packaging, and disposable devices may face new fees and restrictions. Smoking will be discussed as a source of microplastic, litter, fires, and public-cleanup costs.' },
            { year: '2028', title: 'Forecast: Digital Support', text: 'Quit-smoking apps may become much smarter by the end of the decade. Instead of a simple counter, they could track mood, sleep, stress, location-based triggers, and familiar craving moments. Support will become more personal and preventive.' },
            { year: '2030', title: 'Forecast: Tobacco-Free Generation', text: 'Some countries may approach smoke-free goals, where fewer than five percent of adults smoke. Tobacco will lose the image of adulthood and rebellion. For teenagers, cigarettes may feel more like an outdated object from the past.' },
            { year: '2032', title: 'Forecast: Treating Dependence', text: 'Addiction medicine will likely become more precise. Genetic tests, behavioral data, and neuroscience may help tailor therapy: replacement nicotine for some, medication or psychotherapy for others. Quitting will become less of a lonely willpower battle.' },
            { year: '2035', title: 'Forecast: Industry Reinvention', text: 'Tobacco corporations will likely move further from classic cigarettes toward nicotine products, pharmaceuticals, and harm-reduction technologies. The core conflict will remain: regulators and doctors will test whether old dependence is being sold in new packaging.' },
            { year: '2040', title: 'Forecast: Museum of Smoke', text: 'By 2040, indoor smoking may seem almost unbelievable to young people. Packs, airplane ashtrays, and cigarette advertising will look like museum objects. Tobacco history will read as a story of society slowly learning to protect air and health.' }
        ];
        const App = () => {
            const [startDate, setStartDate] = useState(() => {
                const saved = localStorage.getItem('quitDate_v3');
                const parsed = saved ? new Date(saved) : null;
                return parsed && !Number.isNaN(parsed.getTime()) ? parsed : null;
            });
            const [now, setNow] = useState(new Date());
            const [activeTab, setActiveTab] = useState('timer');
            const [selectedAch, setSelectedAch] = useState(null);
            const [expandedSystem, setExpandedSystem] = useState(null);
            const [manualDateOpen, setManualDateOpen] = useState(false);
            const [manualDateValue, setManualDateValue] = useState('');
            const [resetOpen, setResetOpen] = useState(false);
            const [settingsOpen, setSettingsOpen] = useState(false);
            const [lang, setLang] = useState(() => {
                const savedLang = localStorage.getItem('ui_lang_v1');
                if (savedLang === 'ru' || savedLang === 'en') return savedLang;
                const deviceLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
                return deviceLang.startsWith('ru') ? 'ru' : 'en';
            });
            const [theme, setTheme] = useState(() => {
                const savedTheme = localStorage.getItem('ui_theme_v1');
                return savedTheme === 'dark' ? 'dark' : 'light';
            });
            const ui = uiText[lang];
            const activeAchievements = lang === 'en' ? achievementsEn : achievements;
            const activeBodySystems = lang === 'en' ? bodySystemsEn : bodySystems;
            const activeHistoryItems = lang === 'en' ? historyItemsEn : historyItems;
            useEffect(() => { const interval = setInterval(() => setNow(new Date()), 1000); return () => clearInterval(interval); }, []);
            useEffect(() => { localStorage.setItem('ui_lang_v1', lang); }, [lang]);
            useEffect(() => { localStorage.setItem('ui_theme_v1', theme); }, [theme]);
            const diff = Math.max(0, startDate ? now.getTime() - startDate.getTime() : 0);
            const daysTotal = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / (1000 * 60)) % 60);
            const seconds = Math.floor((diff / 1000) % 60);
            const formatDateInput = (d) => {
                const pad = (n) => String(n).padStart(2, '0');
                return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
            };
            const handleStart = () => { const d = new Date(); localStorage.setItem('quitDate_v3', d.toISOString()); setStartDate(d); };
            const handleManualDate = () => {
                const d = startDate || new Date();
                setManualDateValue(formatDateInput(d));
                setManualDateOpen(true);
            };
            const handleManualDateSave = () => {
                const d = new Date(manualDateValue);
                if (!manualDateValue || Number.isNaN(d.getTime()) || d > new Date()) {
                    alert(ui.dateError);
                    return;
                }
                localStorage.setItem('quitDate_v3', d.toISOString());
                setStartDate(d);
                setManualDateOpen(false);
            };
            const handleResetProgress = () => {
                localStorage.removeItem('quitDate_v3');
                setStartDate(null);
                setResetOpen(false);
            };
            return <div className={`max-w-md mx-auto min-h-screen bg-[#f8fafc] shadow-2xl pb-24 relative flex flex-col overflow-hidden ${theme === 'dark' ? 'dark-theme' : ''}`}>
                <header className="p-4 bg-white border-b sticky top-0 z-50 flex justify-between items-center"><div className="flex items-center gap-3"><div className="w-10 h-10 bg-emerald-50 text-emerald-500 rounded-2xl flex items-center justify-center text-base border border-emerald-100"><i className="fas fa-leaf"></i></div><div className="leading-none"><h1 className="font-black text-slate-800 uppercase tracking-wide text-base">{ui.appTitle}</h1><p className="text-[10px] font-bold uppercase tracking-[0.18em] text-emerald-500 mt-1">{ui.tagline}</p></div></div><div className="flex items-center gap-2">{startDate && <button aria-label={ui.reset} onClick={() => setResetOpen(true)} className="min-w-[48px] min-h-[48px] rounded-2xl bg-slate-50 text-slate-400 border border-slate-100 flex items-center justify-center text-lg active:scale-95 hover:bg-red-50 hover:text-red-500 hover:border-red-100 transition-all"><i className="fas fa-rotate-right"></i></button>}<button aria-label={ui.settingsTitle} onClick={() => setSettingsOpen(true)} className="min-w-[48px] min-h-[48px] rounded-2xl bg-slate-50 text-slate-400 border border-slate-100 flex items-center justify-center text-lg active:scale-95 hover:bg-emerald-50 hover:text-emerald-500 hover:border-emerald-100 transition-all"><i className="fas fa-cog"></i></button></div></header>
                <main className="flex-1 overflow-y-auto custom-scrollbar">{!startDate ? <div className="p-8 text-center flex flex-col items-center justify-center min-h-[85vh] fade-in-section"><div className="w-32 h-32 bg-emerald-50 text-emerald-500 rounded-[2.5rem] flex items-center justify-center text-5xl mb-8"><i className="fas fa-seedling"></i></div><h2 className="text-4xl font-black text-slate-800 mb-4 tracking-tight">{ui.heroTitle}</h2><p className="text-slate-500 mb-10 px-4">{ui.heroText}</p><div className="w-full space-y-4"><button onClick={handleStart} className="w-full bg-emerald-100 text-emerald-800 py-6 rounded-3xl font-black text-xl shadow-lg shadow-emerald-100 border border-emerald-200 active:scale-95 transition-transform hover:bg-emerald-200">{ui.startNow}</button><button onClick={handleManualDate} className="w-full bg-white text-slate-500 py-4 rounded-2xl font-bold text-sm border border-slate-100 hover:bg-slate-50 transition-colors">{ui.manualDate}</button></div></div> : <div className="p-4 space-y-8 pb-10 fade-in-section">
                    {activeTab === 'timer' && <div><div className="bg-white rounded-[3rem] p-10 text-center shadow-sm border border-slate-100 mb-8 relative overflow-hidden"><p className="text-slate-400 font-bold uppercase tracking-[0.2em] text-[10px] mb-6">{ui.timerTitle}</p><div className="text-7xl font-black text-slate-800 mb-6 tracking-tighter tabular-nums">{daysTotal}<span className="text-2xl font-medium text-slate-300 ml-2 tracking-normal">{ui.daysShort}</span></div><div className="grid grid-cols-3 gap-4"><div className="bg-slate-50 py-4 rounded-3xl border border-slate-100"><div className="text-2xl font-black text-slate-700">{hours}</div><div className="text-[10px] uppercase font-bold text-slate-400">{ui.hours}</div></div><div className="bg-slate-50 py-4 rounded-3xl border border-slate-100"><div className="text-2xl font-black text-slate-700">{minutes}</div><div className="text-[10px] uppercase font-bold text-slate-400">{ui.minutes}</div></div><div className="bg-emerald-50 py-4 rounded-3xl border border-emerald-100"><div className="text-2xl font-black text-emerald-600">{seconds}</div><div className="text-[10px] uppercase font-bold text-emerald-400">{ui.seconds}</div></div></div></div><div className="px-2"><h3 className="font-black text-xl text-slate-800 mb-6">{ui.achievements}</h3><div className="grid grid-cols-5 gap-3">{activeAchievements.map(ach => <button key={ach.id} onClick={() => setSelectedAch(ach)} className={`aspect-square rounded-2xl flex flex-col items-center justify-center p-2 transition-all ${diff >= ach.goal ? 'bg-white shadow-md text-emerald-500 border-b-2 border-emerald-500' : 'bg-slate-100 text-slate-300 grayscale'}`}><i className={`fas ${ach.icon} text-lg mb-1`}></i><span className="text-[7px] font-black uppercase text-center leading-tight">{ach.title}</span></button>)}</div></div></div>}
                    {activeTab === 'body' && <div className="space-y-4"><div className="px-2 mb-6 text-center"><h2 className="text-3xl font-black text-slate-800 uppercase italic">{ui.bodyTitle}</h2><p className="text-slate-400 text-sm font-medium">{ui.bodySubtitle}</p></div>{activeBodySystems.map(system => <div key={system.id} className="bg-white rounded-[2rem] border border-slate-100 shadow-sm overflow-hidden"><div className="p-5 flex items-center gap-4 cursor-pointer active:bg-slate-50" onClick={() => setExpandedSystem(expandedSystem === system.id ? null : system.id)}><div className={`w-14 h-14 rounded-2xl flex items-center justify-center text-2xl shrink-0 ${system.color}`}><i className={`fas ${system.icon}`}></i></div><div className="flex-1 min-w-0"><h4 className="font-black text-slate-800 truncate">{system.name}</h4><p className="text-slate-400 text-xs truncate font-medium">{system.short}</p></div><i className={`fas fa-chevron-down text-slate-300 transition-transform ${expandedSystem === system.id ? 'rotate-180' : ''}`}></i></div>{expandedSystem === system.id && <div className="px-6 pb-8"><div className="h-px bg-slate-100 mb-6"></div><p className="text-slate-600 leading-relaxed text-sm bg-slate-50 p-4 rounded-2xl border-l-4 border-emerald-500">{system.text}</p></div>}</div>)}</div>}
                    {activeTab === 'history' && <div className="space-y-6 timeline-line relative"><div className="pl-12 mb-8"><h2 className="text-3xl font-black text-slate-800 italic">{ui.historyTitle}</h2><p className="text-slate-400 text-sm font-medium">{ui.historySubtitle}</p></div>{activeHistoryItems.map((item, i) => <div key={i} className="pl-12 relative mb-12"><div className="absolute left-[-11px] top-1 w-6 h-6 rounded-full bg-white border-4 border-emerald-500 z-10 shadow-sm"></div><div className="bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm hover:shadow-md transition-shadow"><span className="inline-block px-3 py-1 bg-slate-900 text-white rounded-full text-[10px] font-black uppercase mb-4">{item.year}</span><h4 className="font-black text-xl mb-3 text-slate-800 leading-tight">{item.title}</h4><p className="text-slate-500 leading-relaxed text-sm">{item.text}</p></div></div>)}</div>}
                </div>}</main>
                {selectedAch && <div className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-slate-900/80 backdrop-blur-sm" onClick={() => setSelectedAch(null)}><div className="bg-white rounded-[3rem] p-10 w-full max-w-sm text-center shadow-2xl" onClick={e => e.stopPropagation()}><div className={`w-24 h-24 mx-auto rounded-[2rem] flex items-center justify-center text-4xl mb-6 ${diff >= selectedAch.goal ? 'bg-emerald-50 text-emerald-500' : 'bg-slate-50 text-slate-300'}`}><i className={`fas ${selectedAch.icon}`}></i></div><h3 className="text-2xl font-black mb-3 text-slate-800">{selectedAch.title}</h3><p className="text-slate-500 mb-8 leading-relaxed text-sm">{selectedAch.desc}</p><button onClick={() => setSelectedAch(null)} className="w-full py-5 bg-slate-900 text-white rounded-2xl font-black uppercase tracking-widest text-xs">{ui.close}</button></div></div>}
                {manualDateOpen && <div className="fixed inset-0 z-[110] flex items-end sm:items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm" onClick={() => setManualDateOpen(false)}><div className="bg-white rounded-[2rem] p-6 w-full max-w-sm shadow-2xl" onClick={e => e.stopPropagation()}><div className="flex items-center gap-3 mb-5"><div className="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-500 flex items-center justify-center text-xl"><i className="fas fa-calendar-day"></i></div><div><h3 className="text-xl font-black text-slate-800">{ui.dateTitle}</h3><p className="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">{ui.dateSubtitle}</p></div></div><label className="block text-[10px] font-black uppercase tracking-[0.18em] text-slate-400 mb-2">{ui.dateLabel}</label><input type="datetime-local" value={manualDateValue} onChange={e => setManualDateValue(e.target.value)} max={formatDateInput(new Date())} className="w-full min-h-[56px] rounded-2xl border border-slate-200 bg-slate-50 px-4 text-base font-bold text-slate-800 outline-none focus:border-emerald-400 focus:ring-4 focus:ring-emerald-50" /><div className="grid grid-cols-2 gap-3 mt-6"><button onClick={() => setManualDateOpen(false)} className="py-4 rounded-2xl bg-slate-100 text-slate-500 font-black uppercase tracking-widest text-xs">{ui.cancel}</button><button onClick={handleManualDateSave} className="py-4 rounded-2xl bg-emerald-100 text-emerald-800 font-black uppercase tracking-widest text-xs border border-emerald-200">{ui.save}</button></div></div></div>}
                {resetOpen && <div className="fixed inset-0 z-[110] flex items-end sm:items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm" onClick={() => setResetOpen(false)}><div className="bg-white rounded-[2rem] p-6 w-full max-w-sm shadow-2xl" onClick={e => e.stopPropagation()}><div className="flex items-center gap-3 mb-5"><div className="w-12 h-12 rounded-2xl bg-red-50 text-red-500 flex items-center justify-center text-xl"><i className="fas fa-rotate-right"></i></div><div><h3 className="text-xl font-black text-slate-800">{ui.resetTitle}</h3><p className="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">{ui.resetSubtitle}</p></div></div><p className="text-sm leading-relaxed text-slate-500 bg-slate-50 rounded-2xl p-4">{ui.resetText}</p><div className="grid grid-cols-2 gap-3 mt-6"><button onClick={() => setResetOpen(false)} className="py-4 rounded-2xl bg-slate-100 text-slate-500 font-black uppercase tracking-widest text-xs">{ui.cancel}</button><button onClick={handleResetProgress} className="py-4 rounded-2xl bg-red-50 text-red-600 font-black uppercase tracking-widest text-xs border border-red-100">{ui.reset}</button></div></div></div>}
                {settingsOpen && <div className="fixed inset-0 z-[120] flex items-end sm:items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm" onClick={() => setSettingsOpen(false)}><div className="bg-white rounded-[2rem] p-6 w-full max-w-sm shadow-2xl" onClick={e => e.stopPropagation()}><div className="flex items-center gap-3 mb-6"><div className="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-500 flex items-center justify-center text-xl"><i className="fas fa-cog"></i></div><div><h3 className="text-xl font-black text-slate-800">{ui.settingsTitle}</h3><p className="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">{ui.settingsSubtitle}</p></div></div><div className="space-y-5"><div><p className="text-[10px] font-black uppercase tracking-[0.18em] text-slate-400 mb-2">{ui.language}</p><div className="grid grid-cols-2 gap-2 bg-slate-50 p-1 rounded-2xl"><button onClick={() => setLang('ru')} className={`py-3 rounded-xl font-black text-xs uppercase tracking-widest ${lang === 'ru' ? 'bg-white text-emerald-600 shadow-sm' : 'text-slate-400'}`}>{ui.russian}</button><button onClick={() => setLang('en')} className={`py-3 rounded-xl font-black text-xs uppercase tracking-widest ${lang === 'en' ? 'bg-white text-emerald-600 shadow-sm' : 'text-slate-400'}`}>{ui.english}</button></div></div><div><p className="text-[10px] font-black uppercase tracking-[0.18em] text-slate-400 mb-2">{ui.theme}</p><div className="grid grid-cols-2 gap-2 bg-slate-50 p-1 rounded-2xl"><button onClick={() => setTheme('light')} className={`py-3 rounded-xl font-black text-xs uppercase tracking-widest ${theme === 'light' ? 'bg-white text-emerald-600 shadow-sm' : 'text-slate-400'}`}>{ui.light}</button><button onClick={() => setTheme('dark')} className={`py-3 rounded-xl font-black text-xs uppercase tracking-widest ${theme === 'dark' ? 'bg-white text-emerald-600 shadow-sm' : 'text-slate-400'}`}>{ui.dark}</button></div></div></div><button onClick={() => setSettingsOpen(false)} className="w-full mt-6 py-4 rounded-2xl bg-slate-900 text-white font-black uppercase tracking-widest text-xs">{ui.close}</button></div></div>}
                {startDate && <nav className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white/95 backdrop-blur-xl border-t border-slate-100 flex justify-around p-4 z-50 shadow-[0_-10px_30px_rgba(0,0,0,0.05)]">{[{id:'timer',icon:'fa-heart-pulse',label:ui.path},{id:'body',icon:'fa-dna',label:ui.body},{id:'history',icon:'fa-book-open',label:ui.history}].map(tab => <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex flex-col items-center gap-1 transition-all flex-1 ${activeTab === tab.id ? 'text-slate-900 scale-105' : 'text-slate-300'}`}><div className={`w-12 h-12 rounded-2xl flex items-center justify-center text-xl transition-colors ${activeTab === tab.id ? 'bg-slate-900 text-white shadow-lg' : 'bg-transparent'}`}><i className={`fas ${tab.icon}`}></i></div><span className="text-[9px] font-black uppercase tracking-widest block">{tab.label}</span></button>)}</nav>}
            </div>;
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
